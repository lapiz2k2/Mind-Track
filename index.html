<span class="tag tag-primary">
  1 → 5 mức độ tăng dần
</span>

<div class="scale-grid">

  <div class="scale-option">
    <input
      id="stress1"
      type="radio"
      name="stress"
      value="1"
      required>

    <label for="stress1">
      <div class="scale-num">1</div>

      <div class="scale-short">
        Rất thấp
      </div>

      <div class="scale-help">
        Thoải mái, gần như không áp lực
      </div>
    </label>
  </div>


  <div class="scale-option">
    <input
      id="stress2"
      type="radio"
      name="stress"
      value="2">

    <label for="stress2">
      <div class="scale-num">2</div>

      <div class="scale-short">
        Thấp
      </div>

      <div class="scale-help">
        Ít áp lực, khá thoải mái
      </div>
    </label>
  </div>


  <div class="scale-option">
    <input
      id="stress3"
      type="radio"
      name="stress"
      value="3">

    <label for="stress3">
      <div class="scale-num">3</div>

      <div class="scale-short">
        Trung bình
      </div>

      <div class="scale-help">
        Có áp lực nhưng vẫn kiểm soát
      </div>
    </label>
  </div>


  <div class="scale-option">
    <input
      id="stress4"
      type="radio"
      name="stress"
      value="4">

    <label for="stress4">
      <div class="scale-num">4</div>

      <div class="scale-short">
        Cao
      </div>

      <div class="scale-help">
        Khá áp lực, khó thư giãn
      </div>
    </label>
  </div>


  <div class="scale-option">
    <input
      id="stress5"
      type="radio"
      name="stress"
      value="5">

    <label for="stress5">
      <div class="scale-num">5</div>

      <div class="scale-short">
        Rất cao
      </div>

      <div class="scale-help">
        Rất áp lực, khó cân bằng
      </div>
    </label>
  </div>

</div>
